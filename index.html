<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Game Arcade</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1d1c1a; --muted: #67635c;
    --line: #e2ded6; --accent: #2f6fde; --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 14px rgb(0 0 0 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151618; --card: #1f2124; --ink: #ecebe8; --muted: #a09d97;
            --line: #2e3034; --accent: #7aa7ff; --shadow: 0 1px 2px rgb(0 0 0 / .4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 16px 8px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4.5vw, 2.4rem); letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .grid { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px;
          display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .term { display: block; color: inherit; text-decoration: none; background: var(--card);
          border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
          transition: transform .15s ease, border-color .15s ease; }
  .term:hover, .term:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
  .pic { aspect-ratio: 16 / 9; background: linear-gradient(135deg, #3a4ccf, #8d3fcf); }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
  .caption { padding: 12px 16px 15px; }
  .caption strong { display: block; font-size: 1.25rem; }
  .caption span { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Student Game Arcade</h1>
  <p>Games made by our students. Pick a term to play.</p>
</header>
<main class="grid" id="grid"></main>
<script>
  const TERMS = [{"folder": "2026-fall", "label": "Fall 2026", "count": 1, "thumb": "2026-fall/thumbs/llama_run.png"}];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const grid = document.getElementById('grid');
  for (const t of TERMS) {
    const a = document.createElement('a');
    a.className = 'term';
    a.href = encodeURIComponent(t.folder) + '/';
    a.innerHTML = `<div class="pic">${t.thumb ? `<img src="${esc(t.thumb)}" alt="" loading="lazy">` : ''}</div>
      <div class="caption"><strong>${esc(t.label)}</strong><span>${t.count} game${t.count === 1 ? '' : 's'}</span></div>`;
    grid.append(a);
  }
</script>
</body>
</html>
